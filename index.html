<script>const gal=document.getElementById('gal');async function load(){try{const r=await fetch('https://api.github.com/repos/Davidjesus838/rgproyectos.cl/contents/');const f=await r.json();f.filter(x=>/\.(jpe?g|png|webp)$/i.test(x.name)).forEach(file=>{let c='piso';const n=file.name.toLowerCase();if(n.includes('wall')||n.includes('panel'))c='wall';else if(n.includes('tabiq'))c='tabique';else if(n.includes('ceram'))c='ceramica';const d=document.createElement('div');d.className='card';d.dataset.cat=c;d.innerHTML=`<img src="${file.download_url}" loading="lazy"><span class="tag">${c}</span>`;d.onclick=()=>{document.getElementById('big').src=file.download_url;document.getElementById('modal').classList.add('show')};gal.appendChild(d)});}catch(e){}}function drag(){const w=document.getElementById('ba1'),a=document.getElementById('baAfter1'),h=document.getElementById('h1');let d=false;function u(x){const r=w.getBoundingClientRect();let p=((x-r.left)/r.width)*100;p=Math.max(5,Math.min(95,p));a.style.clipPath=`inset(0 ${100-p}% 0 0)`;h.style.left=p+'%';}h.addEventListener('mousedown',()=>d=true);window.addEventListener('mouseup',()=>d=false);window.addEventListener('mousemove',e=>{if(d)u(e.clientX)});h.addEventListener('touchstart',()=>d=true,{passive:true});window.addEventListener('touchend',()=>d=false);w.addEventListener('touchmove',e=>{if(d)u(e.touches[0].clientX)},{passive:true});w.addEventListener('click',e=>u(e.clientX));}document.querySelectorAll('.filters button').forEach(b=>{b.onclick=()=>{document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');const f=b.dataset.f;document.querySelectorAll('.card').forEach(c=>{c.style.display=(f==='all'||c.dataset.cat===f)?'block':'none'})}});load();drag();</script></body></html>
